name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run core unit tests
        run: make test

      - name: Build the app
        run: make app

      # Every binary built for Info.plist's LSMinimumSystemVersion, and the
      # cask saying the same.
      - name: Check the deployment target
        run: scripts/check-minos.sh

      # The app driven offscreen (tests/gui/Harness.h): no window ever
      # reaches the screen, and the run has its own home, settings and
      # temporary folder. The language server checks talk to a scripted
      # server (tests/fakelsp) that make guitest builds, so none of them
      # needs a real server installed on the runner.
      - name: Run the GUI checks
        run: make guitest

  linux:
    name: GTK4 port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK4, VTE, WebKitGTK and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential pkg-config \
            libgtk-4-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev \
            libpoppler-glib-dev

      # apt will happily install a runtime library and leave the -dev package
      # out, and Meson would then just report the panel as disabled and build a
      # green but much smaller app. Fail here instead, where the reason is
      # obvious. See the same warning in BUILD-LINUX.md.
      - name: Confirm the dev packages actually landed
        run: pkg-config --modversion gtk4 vte-2.91-gtk4 webkitgtk-6.0 poppler-glib

      # The shared core in ../src, the same tests the macOS job runs, built
      # here with g++ (the top-level Makefile picks clang++ only on the Mac).
      - name: Run core unit tests
        run: make test

      # -Denabled rather than the default auto-detection: this job exists to
      # compile Terminal.cpp, Browser.cpp and PdfView.cpp, so a missing library
      # has to be a failure and not a silent skip.
      - name: Configure with every panel enabled
        working-directory: linux
        run: meson setup build -Dterminal=enabled -Dbrowser=enabled -Dpdf=enabled

      - name: Build
        working-directory: linux
        run: meson compile -C build

      - name: Test
        working-directory: linux
        run: meson test -C build --print-errorlogs

      # The Makefile is the documented fallback for a minimal install. Its test
      # target needs no GTK and no display, so it is cheap to keep honest.
      - name: Makefile fallback tests
        working-directory: linux
        run: make test

  # The core tests again, built with AddressSanitizer and
  # UndefinedBehaviorSanitizer (`make test-asan`, g++ here), with the
  # fuzz groups (tests/parser_fuzz.inc, tests/terminal_fuzz.inc) feeding
  # the parsers random and damaged input. Undefined behaviour is built to
  # stop the run at its first report, and leaks fail it at exit.
  sanitizers:
    name: Core tests under ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run core unit tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make test-asan

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Gradle 8 runs on JDK 17 to 21 (it refuses newer ones). The runner
      # has the Android SDK, with its licenses accepted, so the Android
      # Gradle plugin fetches the NDK it wants if that one is missing.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The debug build is signed with a debug key Gradle makes on the spot;
      # the release key never leaves the release Mac, so CI builds this one.
      # It compiles the shared core from ../src through the NDK, which the
      # other jobs never do.
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
