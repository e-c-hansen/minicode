name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run by hand (the Actions tab, or `gh workflow run CI --ref <branch>`),
  # for checking a branch again or measuring how often a check fails.
  workflow_dispatch:

# A newer push to a pull request's branch cancels that branch's run still
# going, which nobody will read; runs on main always finish, so each commit
# there has a verdict. A run by hand is a group of its own, so several can
# run at once on one commit (measuring how often a check fails).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash with pipefail everywhere (the default shell on macOS runners has no
# pipefail), so a test's status survives the `| tee` that keeps its log.
defaults:
  run:
    shell: bash

# Every test step keeps its output in $RUNNER_TEMP/ci-logs, and each job's
# last step (scripts/ci-summary.sh) turns what failed there into one line a
# check, at the top of the run's page and as annotations on the pull
# request. The runner images are named, not "latest", so a new image (a new
# Xcode, a new libstdc++) arrives as a change of this file, on a branch,
# rather than as a red main.
jobs:
  macos:
    name: macOS app
    runs-on: macos-26
    # Every job has a limit well past its usual length (the slowest of the Linux
    # jobs, ASan, takes about 7 minutes), so a hang fails the job instead of
    # holding a runner and main's status for the six hours GitHub allows. This
    # one took about 18 minutes before the compiler cache and the GUI checks in
    # two halves (2026-11-17); the GUI harness has a 25-minute backstop too.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # ccache in front of clang++ (scripts/ci-ccache.sh says why a cached
      # object can never stand in for a changed one), restored from the
      # newest cache for this compiler: this branch's, else main's. A pull
      # request then compiles only the files it changed.
      - name: Put ccache in front of the compiler
        id: ccache
        run: scripts/ci-ccache.sh setup clang++ clang++

      - name: Restore the compiler cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-macos-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-
            ccache-macos-${{ steps.ccache.outputs.compiler }}-

      # The app, the core tests and the GUI checks in one make, so its jobs
      # are shared across all three.
      - name: Build the app, the core tests and the GUI checks
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          make app build/run_tests guitest-build 2>&1 | tee "$RUNNER_TEMP/ci-logs/build.log"

      # Every binary built for Info.plist's LSMinimumSystemVersion, and the
      # cask saying the same.
      - name: Check the deployment target
        run: scripts/check-minos.sh

      # The LaTeX preview's click-to-source (tests/latex/sweep.sh): every
      # word of the committed typeset of tests/latex/torture.tex
      # double-clicked through the preview's own click path, failing on a
      # wrong answer or a hit rate below tests/latex/sweep_bound.txt. The
      # PDF and SyncTeX are committed, so no tectonic is needed. It links
      # the objects `make app` built, so it takes seconds; the limit only
      # stops a hang.
      - name: Sweep the LaTeX preview's click-to-source
        timeout-minutes: 10
        run: make latex-sweep 2>&1 | tee "$RUNNER_TEMP/ci-logs/latex-sweep.log"

      # Three processes at once (scripts/ci-together.sh), each with its own
      # log in ci-logs for the summary: the core tests (`make test`'s
      # binary), and the GUI checks as two halves. The halves are split by
      # the time each suite took on CI (November 2026, about 290 s each):
      # the second runs the suites named in GUI_SECOND_HALF, the first
      # every other suite, so a new suite runs in the first without being
      # listed. A name here that no suite has fails the run (Harness.mm).
      # Each harness process has a scratch world of its own (Harness.h:
      # /tmp/mcgui-*, its own home, defaults suite, pasteboard, TMPDIR and
      # control sockets; docs/ci.md lists what was checked for sharing).
      #
      # The GUI checks are the whole app driven offscreen
      # (mac/tests/gui/Harness.h): no window ever reaches the screen. The
      # language server checks talk to a scripted server (tests/fakelsp),
      # so none of them needs a real server installed on the runner.
      #
      # The runner is a shared virtual Mac, slower than the Macs the bounds
      # were set on and uneven from run to run (a full terminal draw took
      # 0.7 ms of CPU on one run and 9 ms on another, November 2026), so it
      # gets room the harness says out loud (Harness.h): waits half again
      # as long (a wait polls, so that only delays a failure), and CPU-time
      # bounds half again as high, a time over the bound but within that
      # passing with a SLOW line in the summary. Of the timing failures on
      # CI from November 6 to 14, all that passed on a rerun were under 1.45
      # times their bound; the real regressions were 1.8 times or more.
      # The bounds are on the CPU time of the thread doing the work, so the
      # processes sharing the runner's cores slow the waits, not the bounds.
      # What a suite leaves for the next (a pinned key window, a window, an
      # alert answer) fails that suite by name, a LEAK line (Harness.h).
      #
      # A GUI suite that fails is run once more at the end of its process,
      # alone, in a fresh process and scratch world (MC_GUI_RETRIES,
      # tests/GuiRetry.h); passing then, it is a FLAKY line at the top of
      # the run's page and the run goes on. At most three suites a job
      # (scripts/ci-summary.sh fails the job past that). The core tests
      # are never retried. docs/ci.md, "Retries", says why and what a
      # FLAKY line asks for.
      - name: Run the core tests and the GUI checks
        id: gui
        env:
          MC_GUI_RETRIES: '3'
          MC_GUI_WAIT_SCALE: '1.5'
          MC_TIMING_SCALE: '1.5'
          PICTURES: ${{ runner.temp }}/gui-pictures
          GUI_SECOND_HALF: >-
            agent_autosave agent_panel agents auto_close bookmarks browser_find
            browser_tabs browserpages config_writes folding format_consent
            git_actions git_gutter git_panel git_review git_verbs idelink keymap
            language latex lsp_fixes lsp_open_tabs lsp_watch
            markdown_preview markdown_side markdown_width multicaret_rows palette
            paste previews problems server_consent split_editor
            structure swatch_escape terminal_exec terminal_links
            terminal_marks terminal_paste terminal_pty terminal_reflow
            terminal_zoom tools_consent tree worktree_review
          # The suites whose CPU-time bounds are tight run alone after the
          # two halves: beside other processes on the runner's few cores a
          # thread's CPU time rises too (shared caches, the virtual cores'
          # siblings), and keystroke failed at 1.23 ms against 1 on
          # 2026-11-17 with both halves running.
          GUI_ALONE: >-
            keystroke large_file foldperf terminal_draw lsp_progress processes
        run: |
          together=0
          scripts/ci-together.sh "$RUNNER_TEMP/ci-logs" \
            core-tests './build/run_tests' \
            gui-checks-1 'MC_GUI_SKIP_SUITES="$GUI_SECOND_HALF $GUI_ALONE" MC_GUI_SNAPSHOTS="$PICTURES/first-half" ./build/guitest' \
            gui-checks-2 'MC_GUI_SNAPSHOTS="$PICTURES/second-half" ./build/guitest $GUI_SECOND_HALF' || together=$?
          alone=0
          scripts/ci-together.sh "$RUNNER_TEMP/ci-logs" \
            gui-checks-alone 'MC_GUI_SNAPSHOTS="$PICTURES/alone" ./build/guitest $GUI_ALONE' || alone=$?
          [ "$together" -eq 0 ] && [ "$alone" -eq 0 ]

      # A picture of the test window at each of the first ten failed checks
      # of each half, and the logs, only when the tests failed.
      - name: Keep the GUI checks' pictures
        if: failure() && steps.gui.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: mac-gui-checks
          path: |
            ${{ runner.temp }}/gui-pictures
            ${{ runner.temp }}/ci-logs
          if-no-files-found: ignore
          retention-days: 7

      # The release build, as scripts/release.sh makes it: no demo scenes
      # or benchmark in the binary (main.mm gets their stubs), the zip
      # holding the app, and the deployment target checked again on what
      # would ship.
      - name: Build the release zip
        run: make dist-zip RELEASE=1

      - name: Check the release build
        run: |
          if nm MiniCode.app/Contents/MacOS/MiniCode | grep -q 'MCDemoStart\|MCBenchStart'; then
            echo "error: the release build still has the demo scenes or the benchmark in it" >&2
            exit 1
          fi
          unzip -l MiniCode.zip | grep -q ' MiniCode.app/Contents/MacOS/MiniCode$'
          unzip -l MiniCode.zip | grep -q ' MiniCode.app/Contents/MacOS/minicode-cli$'
          scripts/check-minos.sh MiniCode.app

      # The cache saved even when a check failed (what it holds is right
      # either way), trimmed to what this run used when the job passed.
      - name: Trim the compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: scripts/ci-ccache.sh finish ${{ job.status }}

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summary
        if: always()
        run: scripts/ci-summary.sh "macOS app" "$RUNNER_TEMP/ci-logs"

  linux:
    name: GTK4 port
    runs-on: ubuntu-26.04
    # About 21 minutes before the compiler cache and the GUI checks in two
    # halves (2026-11-17); the package install alone once took 13 (Ubuntu's
    # mirror, 2026-11-10) and the job was cancelled mid-build at 20.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The last line is the GUI checks' (linux/tests/gui): their display,
      # their XTest input, and dbus-run-session for their private session bus
      # (in dbus-daemon on Ubuntu, which --no-install-recommends would not
      # bring otherwise).
      - name: Install GTK4, VTE, WebKitGTK, poppler, and the GUI checks' tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential pkg-config \
            libgtk-4-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev \
            libpoppler-glib-dev libsqlite3-dev \
            xvfb libxtst-dev dbus-daemon ccache

      # apt will happily install a runtime library and leave the -dev package
      # out, and Meson would then just report the panel as disabled and build a
      # green but much smaller app. Fail here instead, where the reason is
      # obvious. See the same warning in BUILD-LINUX.md. Without xtst Meson
      # builds no GUI checks at all.
      - name: Confirm the dev packages actually landed
        run: |
          pkg-config --modversion gtk4 vte-2.91-gtk4 webkitgtk-6.0 poppler-glib xtst
          command -v Xvfb dbus-run-session

      # No plain `make test` here: the core tests job under ASan and UBSan
      # builds the same tests with the same g++ and libstdc++ and runs every
      # group, the timing bounds included (on a slower build, so a stricter
      # test of them), and the macOS job runs them plainly with clang and
      # libc++. Run here too, they cost five minutes of the longest job.
      #
      # ccache for the build (scripts/ci-ccache.sh): Meson puts ccache in
      # front of g++ by itself when it finds it at `meson setup`, so no
      # compiler is wrapped here. The key holds a hash of the build files.
      - name: Set up ccache
        id: ccache
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          scripts/ci-ccache.sh setup c++

      - name: Restore the compiler cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-gtk-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('linux/meson.build', 'linux/Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-gtk-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('linux/meson.build', 'linux/Makefile') }}-
            ccache-gtk-${{ steps.ccache.outputs.compiler }}-

      # -Denabled rather than the default auto-detection: this job exists to
      # compile Terminal.cpp, Browser.cpp and PdfView.cpp, so a missing library
      # has to be a failure and not a silent skip.
      - name: Configure with every panel enabled
        working-directory: linux
        run: |
          meson setup build -Dterminal=enabled -Dbrowser=enabled -Dpdf=enabled | tee meson-setup.txt
          # Say so if Meson did not take ccache: the build still works, only slower.
          grep -q 'ccache' meson-setup.txt || echo "::warning title=GTK4 port::Meson did not put ccache in front of the compiler"

      - name: Build
        working-directory: linux
        run: meson compile -C build 2>&1 | tee "$RUNNER_TEMP/ci-logs/build.log"

      - name: Test
        working-directory: linux
        run: meson test -C build --print-errorlogs 2>&1 | tee "$RUNNER_TEMP/ci-logs/meson-tests.log"

      # The Makefile is the documented fallback for a minimal install. Its test
      # target needs no GTK and no display, so it is cheap to keep honest.
      - name: Makefile fallback tests
        working-directory: linux
        run: make test 2>&1 | tee "$RUNNER_TEMP/ci-logs/makefile-tests.log"

      # The GUI checks (linux/tests/gui/Harness.h): the whole app on an Xvfb
      # of its own, driven by real X input through XTest, with a scratch home
      # and a private session bus. -v prints their output as it comes, so the
      # log has every FAIL line, and a crash or a stuck step says where it
      # was. The harness's own limit on the run is set inside the step's, so
      # a run that overruns still ends with its summary and the pictures
      # below are kept.
      #
      # Two halves at once (scripts/ci-together.sh), each a `meson test` of
      # its own with its own log base (--no-rebuild, so neither runs ninja
      # while the other reads the build). Each harness process starts its
      # own Xvfb on a display the server picks (-displayfd), its own
      # dbus-run-session, scratch home, XDG folders and TMPDIR (Wrapper.cpp),
      # so the two share nothing but the runner. The second half runs the
      # suites in GUI_SECOND_HALF, the first every other suite (a new suite
      # lands there unlisted); a name no suite has fails the run. The split
      # is by the time each suite took on CI (November 2026, about 240 s a
      # half).
      #
      # Every window makes a web view, whose page WebKit runs inside
      # bubblewrap, and the harness suite fails unless that page answers
      # from inside the sandbox. The runner restricts unprivileged user
      # namespaces (kernel.apparmor_restrict_unprivileged_userns = 1, as
      # on Ubuntu desktops), but its AppArmor loads the bwrap-userns-restrict
      # profile, so bwrap may make one: no sysctl and no
      # WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS (seen on ubuntu-26.04,
      # image 20261101, November 2026).
      - name: GUI checks
        id: gui
        working-directory: linux
        # The whole list ran about 8 minutes in one process (2026-11-17).
        #
        # The same room as the macOS job's GUI checks (see there and
        # linux/tests/gui/Harness.h): waits and CPU-time bounds half again,
        # a SLOW line for a time over its bound, and what a suite leaves for
        # the next failing that suite by name (LEAK lines), and a failed
        # suite run once more by the wrapper, alone, in a fresh run of its
        # own (FLAKY when it passes then; MC_GUI_RETRIES, docs/ci.md).
        timeout-minutes: 20
        env:
          MC_GUI_RETRIES: '3'
          MC_GUI_TOTAL_SECONDS: '1080'
          MC_GUI_WAIT_SCALE: '1.5'
          MC_TIMING_SCALE: '1.5'
          PICTURES: ${{ runner.temp }}/gui-pictures
          GUI_SECOND_HALF: >-
            auto_close backups bookmark_menu bookmarks compare completion_edits
            control detach export_html find_bar fold_budget format
            format_coverage git_actions git_gutter go_back harness idelink
            install_hints keys latex_problems layout lsp_actions markdown_math
            markdown_side_sync maximize mermaid multicaret_perf notes
            organize_imports owner_reports palette problems processes
            recent_folders ruler second_server server_consent server_folding
            server_symbols sessions split_editor sqlite_view startup swatches
            terminal_find terminal_ids terminal_splits terminal_tabs themes
            tree_stall zoom
        run: |
          ../scripts/ci-together.sh "$RUNNER_TEMP/ci-logs" \
            gui-checks-1 'MC_GUI_SKIP_SUITES="$GUI_SECOND_HALF" MC_GUI_SNAPSHOTS="$PICTURES/first-half" meson test -C build --suite gui --no-rebuild --logbase gui-first-half -v --print-errorlogs' \
            gui-checks-2 'MC_GUI_SUITES="$GUI_SECOND_HALF" MC_GUI_SNAPSHOTS="$PICTURES/second-half" meson test -C build --suite gui --no-rebuild --logbase gui-second-half -v --print-errorlogs'

      # The same app with every message between the editor and the session's
      # host (linux/src/SessionLink.h, SESSION-DESIGN.md stage 4a) put through
      # the protocol's encoding and back, each a little late: the wire format
      # and the edit loop's waits exercised before any network carries them.
      # A named set of suites that edit, undo, save and switch tabs; each
      # ends with the harness's check that every buffer is the host's text.
      - name: GUI checks over the session host's wire format
        id: loopback
        working-directory: linux
        timeout-minutes: 12
        env:
          MINICODE_HOST: loopback
          MINICODE_HOST_DELAY_US: '200'
          MC_GUI_RETRIES: '3'
          MC_GUI_TOTAL_SECONDS: '600'
          MC_GUI_WAIT_SCALE: '1.5'
          MC_TIMING_SCALE: '1.5'
          PICTURES: ${{ runner.temp }}/gui-pictures
          GUI_LOOPBACK: >-
            undo_history save tabs preview_tabs split_editor sessions backups
            auto_close snippets line_commands multicaret completion_edits
            lsp_tabs lsp_actions markdown_side_edit csv_table
        run: |
          MC_GUI_SUITES="$GUI_LOOPBACK" MC_GUI_SNAPSHOTS="$PICTURES/loopback" \
            meson test -C build --suite gui --no-rebuild --logbase gui-loopback -v --print-errorlogs \
            2>&1 | tee "$RUNNER_TEMP/ci-logs/gui-loopback.log"

      # A picture of the window on top at each failed check (the first ten
      # of each half), and Meson's logs of the runs, only when the checks
      # failed.
      - name: Keep the GUI checks' pictures
        if: failure() && (steps.gui.outcome == 'failure' || steps.loopback.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: gui-checks
          path: |
            ${{ runner.temp }}/gui-pictures
            linux/build/meson-logs/gui-*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Trim the compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: scripts/ci-ccache.sh finish ${{ job.status }}

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-gtk-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('linux/meson.build', 'linux/Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summary
        if: always()
        run: scripts/ci-summary.sh "GTK4 port" "$RUNNER_TEMP/ci-logs"

  # The core tests again, built with AddressSanitizer and
  # UndefinedBehaviorSanitizer (`make test-asan`, g++ here), with the
  # fuzz groups (tests/parser_fuzz.inc, tests/terminal_fuzz.inc) feeding
  # the parsers random and damaged input. Undefined behaviour is built to
  # stop the run at its first report, and leaks fail it at exit.
  sanitizers:
    name: Core tests under ASan and UBSan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # ccache in front of g++ (scripts/ci-ccache.sh), as in the macOS job.
      - name: Put ccache in front of the compiler
        id: ccache
        run: scripts/ci-ccache.sh setup g++ g++

      - name: Restore the compiler cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-asan-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-asan-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-
            ccache-asan-${{ steps.ccache.outputs.compiler }}-

      - name: Run core unit tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          make test-asan 2>&1 | tee "$RUNNER_TEMP/ci-logs/core-tests-asan.log"

      - name: Trim the compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: scripts/ci-ccache.sh finish ${{ job.status }}

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-asan-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summary
        if: always()
        run: scripts/ci-summary.sh "Core tests under ASan and UBSan" "$RUNNER_TEMP/ci-logs"

  # The core tests under ThreadSanitizer (`make test-tsan`, clang here):
  # Find in Folder's parallel walk, TextFind's regex worker, the language
  # server's reader and the threading groups run with every access between
  # threads checked. A report stops the run; known false positives are
  # suppressed by name in tests/tsan.supp.
  #
  # clang's TSan, not g++'s: with GCC 15.2's libtsan on this runner
  # (ubuntu-26.04, kernel 7.0) the run died about 90 s after the link with
  # a SEGV on the main thread at a pc in a shared library, not the test
  # binary, then a second one in TSan's own signal handler ("nested bug"),
  # printing no report and no stack, while the same
  # suite is clean under clang's TSan on the Mac and under g++'s ASan and
  # UBSan here. clang on Linux still runs the Linux code paths.
  tsan:
    name: Core tests under ThreadSanitizer
    runs-on: ubuntu-26.04
    # A crash once left TSan's signal handler hanging until GitHub's six
    # hours ran out; the steps below have limits of their own, so a hang
    # fails and the backtrace step still runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install clang and its sanitizer runtimes
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-22 libclang-rt-22-dev gdb ccache
          clang++-22 --version

      # ccache in front of clang++-22 (scripts/ci-ccache.sh), as in the macOS job.
      - name: Put ccache in front of the compiler
        id: ccache
        run: scripts/ci-ccache.sh setup clang++-22 clang++-22

      - name: Restore the compiler cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-tsan-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-tsan-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-
            ccache-tsan-${{ steps.ccache.outputs.compiler }}-

      # A narrower mmap randomization than the runner's 32 bits, as TSan's
      # shadow layout expects (newer runtimes re-exec without ASLR
      # otherwise). Printed back, so the log shows it took.
      - name: Let ThreadSanitizer map its shadow memory
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl vm.mmap_rnd_bits

      # Each group's name goes to stderr as it starts (MC_PRINT_GROUPS), so
      # a run that dies says in which group.
      - name: Run core unit tests with ThreadSanitizer
        shell: bash
        env:
          MC_PRINT_GROUPS: '1'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          timeout 25m make test-tsan CXX=clang++-22 2>&1 | tee tsan.log "$RUNNER_TEMP/ci-logs/core-tests-tsan.log"

      # Only after a crash (a signal, not a race report): the same binary
      # again under gdb, for a backtrace and the library each frame is in.
      - name: Backtrace of a crash
        if: failure()
        shell: bash
        run: |
          grep -q 'DEADLYSIGNAL\|SEGV\|Terminated' tsan.log || exit 0
          MC_SKIP_TIMING=1 MC_PRINT_GROUPS=1 \
          TSAN_OPTIONS="halt_on_error=1 handle_segv=0 suppressions=$PWD/tests/tsan.supp" \
            timeout 12m gdb -q -batch -ex 'handle SIGPIPE nostop noprint pass' \
                -ex run -ex 'bt 40' -ex 'info sharedlibrary' \
                -ex 'x/6i $pc' build/test-tsan/run_tests

      - name: Trim the compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: scripts/ci-ccache.sh finish ${{ job.status }}

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-tsan-${{ steps.ccache.outputs.compiler }}-${{ hashFiles('Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summary
        if: always()
        run: scripts/ci-summary.sh "Core tests under ThreadSanitizer" "$RUNNER_TEMP/ci-logs"

  android:
    name: Android debug APK and Kotlin checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Gradle 8 runs on JDK 17 to 21 (it refuses newer ones). The runner
      # has the Android SDK, with its licenses accepted, so the Android
      # Gradle plugin fetches the NDK it wants if that one is missing.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The debug build is signed with a debug key Gradle makes on the spot;
      # the release key never leaves the release Mac, so CI builds this one.
      # It compiles the shared core from ../src through the NDK, which the
      # other jobs never do.
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # The Kotlin checks (android/checks, app/src/test/kotlin): plain JVM
      # code, no test library, comparing the app's constants with the C++
      # it mirrors and checking its pure logic (the leader key's presses).
      - name: Run the Kotlin checks
        working-directory: android
        run: ./gradlew --no-daemon kotlinChecks

  # The release APK through the release Gradle path (R8, resource
  # shrinking, signing), signed with a key made in this job and thrown away
  # with the runner. The owner's release key never comes near CI: every
  # update must carry its signature, so it stays on the release Mac.
  android-release:
    name: Android release APK
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make a throwaway signing key
        run: |
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" \
            -alias minicode -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$pass" -keypass "$pass" -dname "CN=minicode CI throwaway"
          echo "MINICODE_KEYSTORE=$RUNNER_TEMP/throwaway.keystore" >> "$GITHUB_ENV"
          echo "MINICODE_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # Signed, and with the throwaway key: an unsigned APK (no key given)
      # or one signed by anything else fails here.
      - name: Check the APK's signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'CN=minicode CI throwaway' "$RUNNER_TEMP/certs.txt"

  # One check that is green only when every job above is: the one to make
  # required in main's branch protection (docs/ci.md), so a job added or
  # renamed later is covered without changing the repository's settings.
  # It runs even when a job failed or was cancelled (always()), and fails
  # then, naming the jobs.
  ci-passed:
    name: CI passed
    if: always()
    needs: [macos, linux, sanitizers, tsan, android, android-release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          {
            echo "### CI passed?"
            echo
            if [ -z "$bad" ]; then echo "Every job passed."; else
              echo "Not every job passed:"
              printf '%s\n' "$bad" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
