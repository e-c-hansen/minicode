name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    # Every job has a limit well past its usual length (the slowest of the Linux
    # jobs, ASan, takes about 7 minutes), so a hang fails the job instead of
    # holding a runner and main's status for the six hours GitHub allows. This
    # one takes about 13 minutes; the GUI harness has a 25-minute backstop too.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Run core unit tests
        run: make test

      - name: Build the app
        run: make app

      # Every binary built for Info.plist's LSMinimumSystemVersion, and the
      # cask saying the same.
      - name: Check the deployment target
        run: scripts/check-minos.sh

      # The LaTeX preview's click-to-source (tests/latex/sweep.sh): every
      # word of the committed typeset of tests/latex/torture.tex
      # double-clicked through the preview's own click path, failing on a
      # wrong answer or a hit rate below tests/latex/sweep_bound.txt. The
      # PDF and SyncTeX are committed, so no tectonic is needed. It links
      # the objects `make app` built, so it takes seconds; the limit only
      # stops a hang.
      - name: Sweep the LaTeX preview's click-to-source
        timeout-minutes: 10
        run: make latex-sweep

      # The app driven offscreen (tests/gui/Harness.h): no window ever
      # reaches the screen, and the run has its own home, settings and
      # temporary folder. The language server checks talk to a scripted
      # server (tests/fakelsp) that make guitest builds, so none of them
      # needs a real server installed on the runner.
      - name: Run the GUI checks
        run: make guitest

      # The release build, as scripts/release.sh makes it: no demo scenes
      # or benchmark in the binary (main.mm gets their stubs), the zip
      # holding the app, and the deployment target checked again on what
      # would ship.
      - name: Build the release zip
        run: make dist-zip RELEASE=1

      - name: Check the release build
        run: |
          if nm MiniCode.app/Contents/MacOS/MiniCode | grep -q 'MCDemoStart\|MCBenchStart'; then
            echo "error: the release build still has the demo scenes or the benchmark in it" >&2
            exit 1
          fi
          unzip -l MiniCode.zip | grep -q ' MiniCode.app/Contents/MacOS/MiniCode$'
          unzip -l MiniCode.zip | grep -q ' MiniCode.app/Contents/MacOS/minicode-cli$'
          scripts/check-minos.sh MiniCode.app

  linux:
    name: GTK4 port
    runs-on: ubuntu-latest
    # About 10 minutes now that it runs the GUI checks; the package install
    # alone once took 13 (Ubuntu's mirror, 2026-11-10) and the job was
    # cancelled mid-build at 20.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The last line is the GUI checks' (linux/tests/gui): their display,
      # their XTest input, and dbus-run-session for their private session bus
      # (in dbus-daemon on Ubuntu, which --no-install-recommends would not
      # bring otherwise).
      - name: Install GTK4, VTE, WebKitGTK, poppler, and the GUI checks' tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential pkg-config \
            libgtk-4-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev \
            libpoppler-glib-dev libsqlite3-dev \
            xvfb libxtst-dev dbus-daemon

      # apt will happily install a runtime library and leave the -dev package
      # out, and Meson would then just report the panel as disabled and build a
      # green but much smaller app. Fail here instead, where the reason is
      # obvious. See the same warning in BUILD-LINUX.md. Without xtst Meson
      # builds no GUI checks at all.
      - name: Confirm the dev packages actually landed
        run: |
          pkg-config --modversion gtk4 vte-2.91-gtk4 webkitgtk-6.0 poppler-glib xtst
          command -v Xvfb dbus-run-session

      # The shared core in ../src, the same tests the macOS job runs, built
      # here with g++ (the top-level Makefile picks clang++ only on the Mac).
      - name: Run core unit tests
        run: make test

      # -Denabled rather than the default auto-detection: this job exists to
      # compile Terminal.cpp, Browser.cpp and PdfView.cpp, so a missing library
      # has to be a failure and not a silent skip.
      - name: Configure with every panel enabled
        working-directory: linux
        run: meson setup build -Dterminal=enabled -Dbrowser=enabled -Dpdf=enabled

      - name: Build
        working-directory: linux
        run: meson compile -C build

      - name: Test
        working-directory: linux
        run: meson test -C build --print-errorlogs

      # The Makefile is the documented fallback for a minimal install. Its test
      # target needs no GTK and no display, so it is cheap to keep honest.
      - name: Makefile fallback tests
        working-directory: linux
        run: make test

      # The GUI checks (linux/tests/gui/Harness.h): the whole app on an Xvfb
      # of its own, driven by real X input through XTest, with a scratch home
      # and a private session bus. -v prints their output as it comes, so the
      # log has every FAIL line, and a crash or a stuck step says where it
      # was. The harness's own limit on the run is set inside the step's, so
      # a run that overruns still ends with its summary and the pictures
      # below are kept.
      #
      # Every window makes a web view, whose page WebKit runs inside
      # bubblewrap, and the harness suite fails unless that page answers
      # from inside the sandbox. The runner restricts unprivileged user
      # namespaces (kernel.apparmor_restrict_unprivileged_userns = 1, as
      # on Ubuntu desktops), but its AppArmor loads the bwrap-userns-restrict
      # profile, so bwrap may make one: no sysctl and no
      # WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS (seen on ubuntu-26.04,
      # image 20261101, November 2026).
      - name: GUI checks
        id: gui
        working-directory: linux
        timeout-minutes: 10
        env:
          MC_GUI_TOTAL_SECONDS: '420'
          MC_GUI_SNAPSHOTS: ${{ runner.temp }}/gui-pictures
        run: meson test -C build --suite gui -v --print-errorlogs

      # A picture of the window on top at each failed check (the first ten),
      # and Meson's log of the run, only when the checks failed.
      - name: Keep the GUI checks' pictures
        if: failure() && steps.gui.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: gui-checks
          path: |
            ${{ runner.temp }}/gui-pictures
            linux/build/meson-logs/testlog.txt
          if-no-files-found: ignore
          retention-days: 7

  # The core tests again, built with AddressSanitizer and
  # UndefinedBehaviorSanitizer (`make test-asan`, g++ here), with the
  # fuzz groups (tests/parser_fuzz.inc, tests/terminal_fuzz.inc) feeding
  # the parsers random and damaged input. Undefined behaviour is built to
  # stop the run at its first report, and leaks fail it at exit.
  sanitizers:
    name: Core tests under ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Run core unit tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make test-asan

  # The core tests under ThreadSanitizer (`make test-tsan`, clang here):
  # Find in Folder's parallel walk, TextFind's regex worker, the language
  # server's reader and the threading groups run with every access between
  # threads checked. A report stops the run; known false positives are
  # suppressed by name in tests/tsan.supp.
  #
  # clang's TSan, not g++'s: with GCC 15.2's libtsan on this runner
  # (ubuntu-26.04, kernel 7.0) the run died about 90 s after the link with
  # a SEGV on the main thread at a pc in a shared library, not the test
  # binary, then a second one in TSan's own signal handler ("nested bug"),
  # printing no report and no stack, while the same
  # suite is clean under clang's TSan on the Mac and under g++'s ASan and
  # UBSan here. clang on Linux still runs the Linux code paths.
  tsan:
    name: Core tests under ThreadSanitizer
    runs-on: ubuntu-latest
    # A crash once left TSan's signal handler hanging until GitHub's six
    # hours ran out; the steps below have limits of their own, so a hang
    # fails and the backtrace step still runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install clang and its sanitizer runtimes
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-22 libclang-rt-22-dev gdb
          clang++-22 --version

      # A narrower mmap randomization than the runner's 32 bits, as TSan's
      # shadow layout expects (newer runtimes re-exec without ASLR
      # otherwise). Printed back, so the log shows it took.
      - name: Let ThreadSanitizer map its shadow memory
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo sysctl vm.mmap_rnd_bits

      # Each group's name goes to stderr as it starts (MC_PRINT_GROUPS), so
      # a run that dies says in which group.
      - name: Run core unit tests with ThreadSanitizer
        shell: bash
        env:
          MC_PRINT_GROUPS: '1'
        run: |
          set -o pipefail
          timeout 25m make test-tsan CXX=clang++-22 2>&1 | tee tsan.log

      # Only after a crash (a signal, not a race report): the same binary
      # again under gdb, for a backtrace and the library each frame is in.
      - name: Backtrace of a crash
        if: failure()
        shell: bash
        run: |
          grep -q 'DEADLYSIGNAL\|SEGV\|Terminated' tsan.log || exit 0
          MC_SKIP_TIMING=1 MC_PRINT_GROUPS=1 \
          TSAN_OPTIONS="halt_on_error=1 handle_segv=0 suppressions=$PWD/tests/tsan.supp" \
            timeout 12m gdb -q -batch -ex 'handle SIGPIPE nostop noprint pass' \
                -ex run -ex 'bt 40' -ex 'info sharedlibrary' \
                -ex 'x/6i $pc' build/test-tsan/run_tests

  android:
    name: Android debug APK and Kotlin checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Gradle 8 runs on JDK 17 to 21 (it refuses newer ones). The runner
      # has the Android SDK, with its licenses accepted, so the Android
      # Gradle plugin fetches the NDK it wants if that one is missing.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The debug build is signed with a debug key Gradle makes on the spot;
      # the release key never leaves the release Mac, so CI builds this one.
      # It compiles the shared core from ../src through the NDK, which the
      # other jobs never do.
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # The Kotlin checks (android/checks, app/src/test/kotlin): plain JVM
      # code, no test library, comparing the app's constants with the C++
      # it mirrors and checking its pure logic (the leader key's presses).
      - name: Run the Kotlin checks
        working-directory: android
        run: ./gradlew --no-daemon kotlinChecks

  # The release APK through the release Gradle path (R8, resource
  # shrinking, signing), signed with a key made in this job and thrown away
  # with the runner. The owner's release key never comes near CI: every
  # update must carry its signature, so it stays on the release Mac.
  android-release:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make a throwaway signing key
        run: |
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" \
            -alias minicode -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$pass" -keypass "$pass" -dname "CN=minicode CI throwaway"
          echo "MINICODE_KEYSTORE=$RUNNER_TEMP/throwaway.keystore" >> "$GITHUB_ENV"
          echo "MINICODE_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # Signed, and with the throwaway key: an unsigned APK (no key given)
      # or one signed by anything else fails here.
      - name: Check the APK's signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'CN=minicode CI throwaway' "$RUNNER_TEMP/certs.txt"
